name: render-reels
on:
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch: {}
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      API: https://app.anjazo.com
      REEL_TOKEN: ${{ secrets.REEL_TOKEN }}
    steps:
      - name: Any job waiting?
        id: peek
        run: |
          n=$(curl -fsS -H "x-reel-token: $REEL_TOKEN" "$API/reel/peek" | python3 -c "import sys,json;print(json.load(sys.stdin)['n'])")
          echo "n=$n" >> "$GITHUB_OUTPUT"
      - name: Get the renderer
        if: steps.peek.outputs.n != '0'
        run: curl -fsS -H "x-reel-token: $REEL_TOKEN" "$API/reel/bundle" -o b.tgz && tar xzf b.tgz
      - uses: actions/setup-node@v4
        if: steps.peek.outputs.n != '0'
        with:
          node-version: 22
      - name: Tools
        if: steps.peek.outputs.n != '0'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q numpy scipy
          npm install --no-audit --no-fund
      - name: Render and upload
        if: steps.peek.outputs.n != '0'
        run: node scripts/run.mjs
